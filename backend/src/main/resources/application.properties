spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rag_clinical}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:ragapp}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Points at the Python FastAPI AI service
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}

jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}